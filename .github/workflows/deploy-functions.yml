name: Deploy Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - "artifacts/legalos/supabase/functions/**"
      - "artifacts/legalos/supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/legalos
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qeopoiumlnzqwaqzwqcj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        # verify_jwt per function comes from supabase/config.toml.
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
