name: Deploy Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - "artifacts/legalos/supabase/functions/**"
      - "artifacts/legalos/supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  checks:
    # Same gate as pull requests: nothing deploys unless typecheck, vitest,
    # the Deno edge-function tests and the site build all pass.
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/legalos
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qeopoiumlnzqwaqzwqcj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" let a CLI release change deploy behaviour with no
          # change in this repo. Bump deliberately.
          version: 2.121.0
      - name: Deploy all functions
        # verify_jwt per function comes from supabase/config.toml — every
        # function needs an entry (tests/edgeFunctionsConfig.test.ts enforces it).
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe deployed functions
        # Every slug the client calls must answer (non-404), and
        # KNOWN_UNDEPLOYED in src/lib/edgeFunctionAvailability.ts must match.
        # Uses only the public URL + publishable key from the committed .env.
        run: |
          set -a; . ./.env; set +a
          node tests/probe-edge-functions.mjs
