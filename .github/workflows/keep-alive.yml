# Supabase's free tier pauses a project after about a week with no activity.
# A tiny weekly read keeps Uvid awake. The URL and publishable key are public
# by design (they ship in the web bundle); no secret is used here.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qeopoiumlnzqwaqzwqcj.supabase.co/rest/v1/market_visibility_audits?select=id&limit=1" \
            -H "apikey: sb_publishable_nac_qVEnBUZy9qFDd3sgHw_HYa-Tnd-")
          echo "HTTP $code"
          test "$code" = "200"
