name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # AmCham Serbia demo — built separately (its own pnpm workspace) and
      # published alongside the main site at /amcham-preview/. Additive only:
      # nothing above this point changes, and a failure here does not affect
      # the main site's own build/deploy steps.
      #
      # BASE_PATH includes /djongo.github.io/: this repo's name doesn't
      # exactly match the special `<owner>.github.io` user-site pattern
      # (owner is Djongo92, repo is djongo.github.io), so Pages serves it
      # as a project site at that subpath rather than at the bare domain —
      # confirmed via the deploy job's own "Evaluated environment url".
      # The main app's index.html hardcodes the same /djongo.github.io/
      # prefix for its manifest/icon links for the same reason.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install AmCham demo dependencies
        working-directory: amcham-serbia-website
        run: pnpm install --frozen-lockfile
      - name: Build AmCham demo
        working-directory: amcham-serbia-website/artifacts/amcham-serbia
        env:
          PORT: "5000"
          BASE_PATH: /djongo.github.io/amcham-preview/
        run: pnpm run build
      - name: Copy AmCham demo into Pages output
        run: |
          mkdir -p dist/amcham-preview
          cp -r amcham-serbia-website/artifacts/amcham-serbia/dist/public/* dist/amcham-preview/
          rm -f dist/amcham-preview/preview-platform.html dist/amcham-preview/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
