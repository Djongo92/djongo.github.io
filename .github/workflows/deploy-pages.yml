name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Marketing site at the root, web app at /app/, plain static files —
      # everything dynamic is Supabase. SITE_BASE is the project-site subpath:
      # this repo's name doesn't exactly match the `<owner>.github.io`
      # user-site pattern (owner is Djongo92), so Pages serves it as a
      # project site under /djongo.github.io/.
      - name: Build site
        env:
          SITE_BASE: /djongo.github.io/
        run: node scripts/build-site.mjs

      # The AmCham Serbia demo now lives on Cloudflare Pages
      # (amcham-demo.pages.dev, password-protected). The old /amcham-preview/
      # address only forwards there, so existing links keep working.
      - name: Forward the old AmCham demo address
        run: |
          mkdir -p site-dist/amcham-preview
          cat > site-dist/amcham-preview/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <title>AmCham Serbia demo has moved</title>
          <meta http-equiv="refresh" content="0; url=https://amcham-demo.pages.dev/">
          <link rel="canonical" href="https://amcham-demo.pages.dev/">
          <p>The demo has moved to <a href="https://amcham-demo.pages.dev/">amcham-demo.pages.dev</a>.</p>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
