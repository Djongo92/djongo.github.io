openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Marketing lead capture
  - name: demo
    description: Gated product showcase access
paths:
  /demo-access:
    post:
      operationId: verifyDemoAccess
      tags: [demo]
      summary: Verify a showcase invitation code
      description: >
        Checks an invitation code for the gated product showcase. Codes are
        held server-side so they are never readable from the client bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoAccessInput"
      responses:
        "200":
          description: Code accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAccessResult"
        "401":
          description: Code rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "503":
          description: No codes configured, so the showcase is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /report-leads:
    post:
      operationId: createReportLead
      tags: [leads]
      summary: Capture a quarterly report lead
      description: Stores an email address submitted for the quarterly report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportLeadInput"
      responses:
        "201":
          description: Lead stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportLeadResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /demo-requests:
    post:
      operationId: createDemoRequest
      tags: [demo]
      summary: Request a showcase invitation
      description: >
        Stores an email address (and optional firm name) from a visitor who
        landed on the gated showcase without a code, so sales can send one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRequestInput"
      responses:
        "201":
          description: Request stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRequestResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DemoAccessInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - code
    DemoAccessResult:
      type: object
      properties:
        ok:
          type: boolean
        # Who the code was issued to, so the showcase can greet them by name.
        label:
          type: string
      required:
        - ok
    ReportLeadInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
      required:
        - email
    ReportLeadResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    DemoRequestInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
        firmName:
          type: string
          maxLength: 120
      required:
        - email
    DemoRequestResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ApiErrorMessage:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

