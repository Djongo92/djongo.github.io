name = "amcham-compass-worker"
main = "src/index.ts"
compatibility_date = "2026-09-18"

[vars]
# Sites allowed to call Compass, comma-separated. The GitHub Pages site, the
# Cloudflare Pages site, and its per-branch preview links.
ALLOWED_ORIGINS = "https://djongo92.github.io, https://amcham-demo.pages.dev, https://*.amcham-demo.pages.dev"

[[ratelimits]]
name = "COMPASS_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60

# ANTHROPIC_API_KEY is set via `wrangler secret put ANTHROPIC_API_KEY` —
# never store it here, never commit it.
